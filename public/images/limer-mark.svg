<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 12 152 90" width="152" height="90">
  <title>Limer</title>

  <defs>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000A4A"/>
      <stop offset="0.55" stop-color="#062A8C"/>
      <stop offset="1" stop-color="#0B4FB8"/>
    </linearGradient>
    <linearGradient id="towerSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A3FA6"/>
      <stop offset="1" stop-color="#00104F"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2C86C8"/>
      <stop offset="1" stop-color="#8FD3F5"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#001060"/>
      <stop offset="0.6" stop-color="#0A3FA6"/>
      <stop offset="1" stop-color="#1E6FD0"/>
    </linearGradient>
  </defs>

  <!-- arcs behind the towers -->
  <g fill="none" stroke="url(#arc)" stroke-linecap="round">
    <path d="M47 66 A44 44 0 0 1 131 66" stroke-width="3.2"/>
    <path d="M55 64 A36 36 0 0 1 123 64" stroke-width="2.4" opacity="0.8"/>
  </g>

  <!-- towers -->
  <path d="M67 26 L82 18 L93 23 L93 80 L67 80 Z" fill="url(#tower)"/>
  <path d="M82 18 L93 23 L93 80 L82 80 Z" fill="#0B3E9E" opacity="0.55"/>
  <path d="M93 29 L101 26 L113 32 L113 80 L93 80 Z" fill="url(#towerSide)"/>
  <path d="M101 26 L101 80" stroke="#2F7DE0" stroke-width="1.6" opacity="0.7"/>
  <path d="M86 21 L86 80" stroke="#2F7DE0" stroke-width="1.2" opacity="0.5"/>

  <!-- roofs: dark outer stroke + bright inner line -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M14 95 L68 66 L106 96" stroke="url(#roof)" stroke-width="8"/>
    <path d="M100 84 L122 71 L153 95" stroke="url(#roof)" stroke-width="7"/>
    <path d="M18 92 L68 65.5 L103 93" stroke="#3A8BE8" stroke-width="1.4" opacity="0.85"/>
    <path d="M103 82 L122 70.5 L150 92" stroke="#3A8BE8" stroke-width="1.3" opacity="0.85"/>
  </g>
  <!-- chimney -->
  <path d="M137.5 77 L142.5 77 L142.5 87 L137.5 83.5 Z" fill="#00104F"/>
  <!-- windows -->
  <rect x="56" y="80" width="13" height="14" fill="#000A3A"/>
  <rect x="112" y="85" width="8" height="8" fill="#000A3A"/>

</svg>
